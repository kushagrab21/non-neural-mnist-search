name: anthropic-wif-test
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_015opZbhfJ8adx6ArxPBr5RK",
            "organization_id": "0ff3e53b-0e62-45f6-b9cc-6603f2ec2152",
            "service_account_id": "svac_018NAeuiFpyWMegvGHRvSdU8",
            "workspace_id": "wrkspc_013y8459PomyneTLNJXm5bVN"
          }
          JSON
