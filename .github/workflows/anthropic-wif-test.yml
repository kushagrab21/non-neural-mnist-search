name: anthropic-wif-test
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange token and call the Messages API
        run: |
          RESP=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_015opZbhfJ8adx6ArxPBr5RK",
            "organization_id": "0ff3e53b-0e62-45f6-b9cc-6603f2ec2152",
            "service_account_id": "svac_018NAeuiFpyWMegvGHRvSdU8",
            "workspace_id": "wrkspc_013y8459PomyneTLNJXm5bVN"
          }
          JSON
          )
          TOKEN=$(jq -r '.access_token // empty' <<<"$RESP")
          if [ -z "$TOKEN" ]; then
            echo "Token exchange failed:"; jq 'del(.access_token)' <<<"$RESP"; exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "Exchange OK: scope=$(jq -r .scope <<<"$RESP") expires_in=$(jq -r .expires_in <<<"$RESP")s"
          curl -sS --fail-with-body https://api.anthropic.com/v1/messages \
            -H "authorization: Bearer $TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-haiku-5-5","max_tokens":64,"messages":[{"role":"user","content":"Reply with exactly: federation works"}]}' \
            | jq '{id, model, stop_reason, text: .content[0].text, usage}'
